name = "kontor-whatsapp"
main = "worker.js"
compatibility_date = "2025-01-01"

# Domínio: associe uma rota (ex.: wa.kontorgestao.com.br/*) no painel do Cloudflare.

[[kv_namespaces]]
binding = "COTAS"
id = "TROQUE_PELO_ID_DO_KV"   # wrangler kv namespace create COTAS

[vars]
TWILIO_WHATSAPP_FROM = "+55XXXXXXXXXXX"            # número WhatsApp do Twilio aprovado
CHAVE_PUBLICA = "koSMJ7OYyldxeMDkJVi3dIhkLwsvnPMq6EfPVOseknc"   # a mesma de src/licenca-chave.ts
COTA_MENSAL = "200"
CONTENT_SID_LEMBRETE = ""     # HX... do template aprovado (vazio = texto livre, só para testes/sandbox)
CONTENT_SID_ATRASO = ""
CONTENT_SID_NOTA = ""
CONTENT_SID_PAGAMENTO = ""
